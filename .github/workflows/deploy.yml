name: Deploy
# Multi-architecture build pipeline
# Builds binaries for: Linux x86_64, Linux ARM64, Windows x86_64, macOS ARM64, macOS x86_64
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}
jobs:
  build:
    strategy:
      matrix:
        include:
          # --8<-- [start:oses]
          - os: ubuntu-20.04
            python-version: "3.9"
            arch: x86_64
            runner: ubuntu-20.04
          - os: ubuntu-24.04
            python-version: "3.9"
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows-latest
            python-version: "3.9"
            arch: x86_64
            runner: windows-latest
          - os: macos-latest
            python-version: "3.9"
            arch: arm64
            runner: macos-latest
          - os: macos-13
            python-version: "3.9"
            arch: x86_64
            runner: macos-13
          # --8<-- [end:oses]
    runs-on: ${{ matrix.runner }}
    environment:
      name: pypi
      url: https://pypi.org/p/astronomer-telescope
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - uses: extractions/setup-just@v1
      - run: just install
      - run: just build
        if: matrix.os == 'ubuntu-20.04' && matrix.arch == 'x86_64'
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: matrix.os == 'ubuntu-20.04' && matrix.arch == 'x86_64'
        with:
          skip-existing: true
      - run: just package-report
        if: matrix.os == 'ubuntu-20.04' && matrix.arch == 'x86_64'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-20.04' && matrix.arch == 'x86_64'
        with:
          path: airflow_report.pyz
          name: airflow_report
          retention-days: 5
      - run: just package-pyinstaller
      - uses: actions/upload-artifact@v4
        with:
          path: |
            telescope-*
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 5

  release:
    needs: build
    runs-on: "ubuntu-latest"
    steps:
    - uses: actions/download-artifact@v4
    - run: ls -R
    - uses: softprops/action-gh-release@v1
      with:
        prerelease: true
        generate_release_notes: true
        files: |
          airflow_report/airflow_report.pyz
          binary-*/telescope-*
